<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#141413">
<title>Kontent Studio</title>
<script src="https://telegram.org/js/telegram-web-app.js" async></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141413;--bar:#1A1918;--card:#1E1D1B;--raise:#232220;--raise2:#2B2A27;--line:#2E2C29;--line2:#3A3834;
  --ink:#F0EEE6;--ink2:#C9C5BB;--mut:#A6A298;--mut2:#8C887F;--clay:#D97757;--clayL:#E8977C;
  --k:#B5B1A8;--n:#B9AEE6;--i:#8DBBE6;--iB:#6FA8DC;--t:#EBC57E;--tB:#E8B04B;--ok:#8FCB9E;--okB:#4E7A5B;--q:#E8977C;--e:#D9B98A;--x:#EC8A80;
  --sans:Inter,system-ui,-apple-system,sans-serif;--serif:'Source Serif 4',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  --side:380px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:var(--ink)}
a{color:var(--clayL)}
[hidden]{display:none!important}
svg{flex:none}
.mono{font-family:var(--mono)}
.lab{font-size:10.5px;font-weight:600;letter-spacing:.08em;color:var(--mut2);text-transform:uppercase}

/* ---------- top bar ---------- */
#top{position:fixed;left:0;right:0;top:0;height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;gap:10px;background:var(--bar);border-bottom:1px solid var(--line);z-index:30}
.logo{display:flex;align-items:center;gap:9px;flex:none}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--clay);display:flex;align-items:center;justify-content:center}
.logo b{font:600 17px var(--serif);letter-spacing:-.01em}
.sep{width:1px;height:22px;background:var(--line2);flex:none}
.tbtn{height:38px;min-width:38px;padding:0 12px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:500;font-size:13px;color:var(--ink2);border:1px solid transparent;flex:none}
.tbtn:hover{background:var(--raise)}
.tbtn.box{border-color:var(--line2);background:var(--raise)}
.tbtn.clay{background:var(--clay);color:#141413;font-weight:600}
#loyBtn{max-width:min(420px,40vw);min-width:0;flex:0 1 auto}
#loyBtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.flex1{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;flex:none}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pulse i,.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.p-kutmoqda{background:rgba(140,136,127,.16);color:var(--k)}
.p-navbatda{background:rgba(169,155,219,.16);color:var(--n)}
.p-ishlamoqda{background:rgba(111,168,220,.16);color:var(--i)}
.p-tekshiruvda{background:rgba(232,176,75,.16);color:var(--t)}
.p-tasdiqlandi{background:rgba(125,191,142,.16);color:var(--ok)}
.p-qayta{background:rgba(217,119,87,.16);color:var(--q)}
.p-eskirgan{background:rgba(201,162,107,.16);color:var(--e)}
.p-xato{background:rgba(229,103,92,.16);color:var(--x)}
.p-ishlamoqda i{animation:pulse 1.6s ease-in-out infinite}
#agentPill{max-width:30vw;overflow:hidden;text-overflow:ellipsis}

/* ---------- canvas ---------- */
#vp{position:fixed;left:0;top:calc(56px + env(safe-area-inset-top));right:var(--side);bottom:0;overflow:hidden;touch-action:none;cursor:grab;
  background-color:var(--bg);background-image:radial-gradient(#2F2D2A 1.2px,transparent 1.2px);background-size:22px 22px}
#vp.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#edges path{fill:none;stroke-width:2.2}
.e-ok{stroke:#5E8F6B}.e-wait{stroke:#4A4743}.e-act{stroke:var(--iB);stroke-dasharray:7 7;animation:flow .9s linear infinite}
.e-dot{stroke-width:2!important}
@keyframes flow{to{stroke-dashoffset:-14}}

.grp{position:absolute;border:1.5px dashed #3E3B37;border-radius:20px;background:rgba(30,29,27,.5)}
.grp.act{border:1.5px solid var(--iB);background:rgba(30,29,27,.75);box-shadow:0 0 0 4px rgba(111,168,220,.1)}
.grp-h{position:absolute;left:0;right:0;top:0;height:40px;display:flex;align-items:center;gap:8px;padding:0 16px;cursor:move;font-weight:600;font-size:14px}
.grp-h small{font-weight:500;color:var(--mut);font-size:12px}

.node{position:absolute;background:var(--card);border:1px solid #34322E;border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.35);overflow:hidden;transition:box-shadow .15s,border-color .15s,opacity .15s}
.node.sel{outline:2px solid var(--clay);outline-offset:2px}
.node.st-kutmoqda{opacity:.62}
.node.st-ishlamoqda{border-color:var(--iB);box-shadow:0 0 0 4px rgba(111,168,220,.12),0 10px 28px rgba(0,0,0,.4)}
.node.st-tekshiruvda{border-color:var(--tB);box-shadow:0 0 0 4px rgba(232,176,75,.12),0 10px 28px rgba(0,0,0,.4)}
.node.st-qayta{border-color:var(--clay)}
.node.st-eskirgan{border:1.5px dashed #C9A26B}
.node.st-xato{border-color:#E5675C}
.node.dragging{box-shadow:0 18px 44px rgba(0,0,0,.55);z-index:5}
.nh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:move;min-height:44px}
.nh .nn{font-weight:600;font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nh .ico{color:var(--mut2);display:flex}
.nb{padding:11px 12px;display:flex;flex-direction:column;gap:9px}
.nb:empty{display:none}
.nf{padding:8px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--mut2);display:flex;gap:8px;align-items:center}
.nf:empty{display:none}
.hook{margin:0;font:500 15.5px/1.3 var(--serif)}
.ex{margin:0;font-size:12.5px;color:var(--ink2);white-space:pre-line;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ph{font-size:12px;color:var(--mut2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:3px 8px;border-radius:6px;background:var(--raise);font-size:11px;color:var(--ink2)}
.thumb{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px;background:var(--raise2);display:block}
.thumb.tall{aspect-ratio:9/16;max-height:260px;width:auto;margin:0 auto}
.thumb.ph2{display:flex;align-items:center;justify-content:center;color:var(--mut2);font:600 20px var(--mono)}
.sw{display:flex;gap:4px}.sw span{width:24px;height:24px;border-radius:7px;border:1px solid rgba(255,255,255,.08)}
.bar{height:5px;border-radius:3px;background:var(--raise2);overflow:hidden}.bar>i{display:block;height:100%;background:var(--iB);border-radius:3px;transition:width .4s}
audio{width:100%;height:36px}
.node video{width:100%;border-radius:8px;background:#000;display:block;max-height:280px}
.tur-izoh{background:#2C2A1F;border-color:#4A4530}
.tur-izoh .nh{border-color:#4A4530}
.tur-izoh .ex{-webkit-line-clamp:12;color:#EDE6C8}

#zoom{position:absolute;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:2px;background:var(--bar);border:1px solid var(--line2);border-radius:12px;padding:3px;z-index:4}
#zoom button{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:18px}
#zoom button:hover{background:var(--raise)}
#zoomPct{min-width:52px;text-align:center;font:500 12px var(--mono);color:var(--mut)}
#hint{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));font-size:11.5px;color:var(--mut2);background:rgba(26,25,24,.8);padding:6px 10px;border-radius:8px;pointer-events:none;z-index:3}
#bosh{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;z-index:6;pointer-events:none}
#bosh>div{pointer-events:auto;max-width:440px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;background:var(--bar);border:1px solid var(--line);border-radius:18px;padding:28px}
#bosh h2{margin:0;font:600 24px var(--serif)}
#bosh p{margin:0;color:var(--mut)}

/* ---------- side panel ---------- */
#side{position:fixed;right:0;top:calc(56px + env(safe-area-inset-top));bottom:0;width:var(--side);background:var(--bar);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
.stabs{display:flex;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center}
.stabs button{height:36px;padding:0 14px;border-radius:9px;font-weight:600;font-size:13px;color:var(--mut)}
.stabs button.on{background:var(--raise2);color:var(--ink)}
.sbody{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sec{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.sec:last-child{border-bottom:0}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mut{color:var(--mut);font-size:12.5px}
.reja{display:flex;flex-direction:column;gap:2px}
.reja div{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:13px}
.dotc{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.dotc.ok{background:rgba(125,191,142,.18)}.dotc.on{border:2px solid var(--iB)}.dotc.on i{width:6px;height:6px;border-radius:50%;background:var(--iB);animation:pulse 1.6s infinite}.dotc.no{border:1.5px solid #4A4743}
.log{display:flex;gap:10px;font-size:12.5px;line-height:1.45}
.log time{font:400 11px var(--mono);color:var(--mut2);flex:none;padding-top:2px;width:38px}
.log.siz span{color:var(--clayL)}.log.agent span{color:var(--ink2)}.log.tizim span{color:var(--mut)}
.qlist button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;background:var(--raise);min-height:44px}
.qlist{display:flex;flex-direction:column;gap:6px}
.inp{width:100%;border-radius:10px;border:1px solid var(--line2);background:var(--raise);padding:10px 12px;outline:none;resize:vertical}
.inp:focus{border-color:var(--clay)}
.btn{min-height:44px;padding:0 16px;border-radius:10px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--raise)}
.btn.ok{background:#7DBF8E;color:#141413;border-color:transparent}
.btn.clay{background:var(--clay);color:#141413;border-color:transparent}
.btn.red{background:transparent;color:var(--x);border-color:rgba(229,103,92,.4)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:3px}
.fld p{margin:0;white-space:pre-line;font-size:13.5px;color:var(--ink)}
.fld ul{margin:0;padding-left:18px;font-size:13px}
.big img,.big video{width:100%;border-radius:10px;display:block;background:#000;max-height:60vh;object-fit:contain}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.ver{font-size:12.5px;color:var(--mut);display:flex;gap:10px}
.ver b{font:500 11px var(--mono);color:var(--mut2);width:26px;flex:none;padding-top:2px}
.izh{padding:8px 10px;border-radius:8px;background:var(--raise);font-size:12.5px}
.izh.rad{border-left:3px solid var(--x)}
.closeS{margin-left:auto;width:36px;height:36px;border-radius:9px;display:none;align-items:center;justify-content:center;color:var(--mut)}
.radio{display:flex;align-items:center;gap:10px;min-height:40px;font-size:13.5px;cursor:pointer}
.radio input{accent-color:var(--clay);width:18px;height:18px}

/* ---------- modal, toast ---------- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
#modal>div{width:min(560px,100%);max-height:86vh;overflow:auto;background:var(--bar);border:1px solid var(--line2);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
#modal h3{margin:0;font:600 21px var(--serif)}
.lrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--raise);min-height:56px;width:100%;text-align:left}
.lrow.on{outline:1.5px solid var(--clay)}
.lrow .t{flex:1;min-width:0}
.lrow .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#F0EEE6;color:#141413;padding:10px 16px;border-radius:12px;font-weight:500;z-index:80;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.err{background:#E5675C;color:#fff}
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:19;display:none}

/* ---------- planshet va telefon ---------- */
@media (max-width:1099px){
  #vp{right:0}
  #side{transform:translateX(105%);transition:transform .22s ease;box-shadow:-20px 0 40px rgba(0,0,0,.4)}
  body.sideOpen #side{transform:none}
  body.sideOpen #sheetBg{display:block}
  .closeS{display:flex}
  #sideBtn{display:inline-flex!important}
}
@media (max-width:699px){
  #side{top:auto;left:0;right:0;width:auto;height:min(78vh,720px);border-left:0;border-top:1px solid var(--line2);border-radius:18px 18px 0 0;transform:translateY(105%)}
  .logo b,#agentPill,.hideS{display:none!important}
  #hint{display:none}
}
#sideBtn{display:none}
</style>
</head>
<body>
<header id="top">
  <div class="logo"><i><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#141413" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><path d="M10 6.5h4a3 3 0 0 1 3 3V14"/></svg></i><b>Kontent Studio</b></div>
  <div class="sep hideS"></div>
  <button id="loyBtn" class="tbtn box" type="button" aria-label="Loyihalar"><span id="loyNom">Loyiha tanlang</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
  <span id="agentPill" class="pill" hidden></span>
  <div class="flex1"></div>
  <button id="qaydBtn" class="tbtn" type="button" aria-label="Qayd qo'shish"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v11l-5 5H4z"/><path d="M15 20v-5h5"/></svg><span class="hideS">Qayd</span></button>
  <button id="yangiBtn" class="tbtn clay" type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="hideS">Yangi video</span></button>
  <button id="sideBtn" class="tbtn box" type="button" aria-label="Agent paneli"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg><span id="sideBadge" class="hideS">Agent</span></button>
</header>

<main id="vp" aria-label="Doska">
  <div id="world"><svg id="edges" width="1" height="1" aria-hidden="true"></svg><div id="grps"></div><div id="nodes"></div></div>
  <div id="zoom">
    <button type="button" id="zOut" aria-label="Kichiklashtirish">−</button>
    <span id="zoomPct">100%</span>
    <button type="button" id="zIn" aria-label="Kattalashtirish">+</button>
    <button type="button" id="zFit" aria-label="Hammasini ko'rsatish"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div id="hint">Surish: sudrang · Zoom: g‘ildirak yoki pinch · F — hammasi</div>
  <div id="bosh" hidden></div>
</main>

<div id="sheetBg"></div>
<aside id="side" aria-label="Panel">
  <div class="stabs">
    <button type="button" data-tab="agent" class="on">Agent</button>
    <button type="button" data-tab="tugun" id="tabTugun" hidden>Tugun</button>
    <button type="button" class="closeS" id="closeS" aria-label="Yopish"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="sbody" id="sbody"></div>
</aside>

<div id="modal" hidden><div id="mbody"></div></div>
<div id="toast" hidden></div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DEMO = new URLSearchParams(location.search).has('demo');
const HOLAT = { kutmoqda: 'Kutmoqda', navbatda: 'Navbatda', ishlamoqda: 'Ishlamoqda', tekshiruvda: 'Tekshiruvda', tasdiqlandi: 'Tasdiqlandi', qayta: 'Qayta', eskirgan: 'Eskirgan', xato: 'Xato' };
const GURUH = { referens: 'Referenslar', sahna: 'Demo sahnalar' };
const IC = {
  ssenariy: '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
  ovoz: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  referens: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/>',
  sahna: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M8 5l-2 4M13 5l-2 4M18 5l-2 4"/>',
  video: '<rect x="3" y="5" width="13" height="14" rx="2"/><path d="m16 10 5-3v10l-5-3"/>',
  reliz: '<path d="m21 4-18 7 6 2 2 6 3-4 5 4z"/>',
  izoh: '<path d="M4 4h16v11l-5 5H4z"/><path d="M15 20v-5h5"/>',
  check: '<path d="m5 12 5 5 9-10"/>',
};
const ic = (n, s = 15, w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n] || ''}</svg>`;

const S = { loyihalar: [], id: null, d: null, belgi: 0, cam: { x: 60, y: 60, z: 0.8 }, sel: null, tab: 'agent', h: new Map(), sig: new Map(), drag: null, busy: false };

// ---------------- Kirish ----------------
(function hashKalit() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('k')) { try { localStorage.setItem('studio_k', h.get('k')); } catch (e) {} }
  if (h.get('l')) S.id = Number(h.get('l')) || null;
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
})();
const kalit = () => { try { return localStorage.getItem('studio_k') || ''; } catch (e) { return ''; } };
const initData = () => (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData) || '';

async function api(action, body) {
  if (DEMO) return demo(action, body || {});
  const headers = { 'Content-Type': 'application/json' };
  if (initData()) headers['X-Init-Data'] = initData(); else headers['X-Studio-Key'] = kalit();
  const r = await fetch('/api/studio', { method: 'POST', headers, body: JSON.stringify(Object.assign({ action }, body || {})) });
  const j = await r.json().catch(() => ({ error: 'Server javob bermadi' }));
  if (r.status === 401) { kirishYoq(j.error); throw new Error(j.error); }
  if (!r.ok) throw new Error(j.error || 'Xato');
  return j;
