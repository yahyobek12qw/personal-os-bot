<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FAF9F5">
<title>Studiya</title>
<script src="https://telegram.org/js/telegram-web-app.js" async></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
/* Studiya — ikki shrift: Source Serif 4 (sarlavha) + Inter (interfeys). Claude uslubi: fil suyagi fon, loy rang aksent. */
:root{
  --bg:#FAF9F5;--panel:#FFFFFF;--soft:#F0EEE6;--soft2:#E8E6DC;--ink:#141413;--ink2:#3D3D3A;--mut:#6B6A64;--mut2:#8A8983;
  --line:rgba(31,30,29,.10);--line2:rgba(31,30,29,.18);--clay:#D97757;--clayD:#B5583A;--claySoft:#F7E3D9;
  --ok:#4F7A4F;--okSoft:#E3EEDD;--info:#3E6FA8;--infoSoft:#E1EAF5;--warn:#A86B12;--warnSoft:#F6EBD3;--err:#B3453A;--errSoft:#F6DEDA;--violet:#6A5BA8;--violetSoft:#E9E5F5;
  --dot:#DEDBD0;--sh:0 1px 2px rgba(20,20,19,.05),0 6px 20px rgba(20,20,19,.06);--sh2:0 18px 50px rgba(20,20,19,.16);
  --serif:'Source Serif 4',Georgia,serif;--sans:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --rail:248px;--insp:400px;color-scheme:light;
}
html[data-theme=dark]{
  --bg:#1F1E1D;--panel:#2A2927;--soft:#33322F;--soft2:#3D3C38;--ink:#F3F1EA;--ink2:#D9D6CD;--mut:#A6A39A;--mut2:#8C8981;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--claySoft:#4A2E24;--clayD:#F0A58A;
  --ok:#93C48F;--okSoft:#2B3A2A;--info:#8DB6E6;--infoSoft:#26323F;--warn:#E3B565;--warnSoft:#3E3322;--err:#EF8E83;--errSoft:#47292A;--violet:#B8ACE8;--violetSoft:#33304A;
  --dot:#34332F;--sh:0 1px 2px rgba(0,0,0,.3);--sh2:0 18px 50px rgba(0,0,0,.5);color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body{overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
a{color:var(--clayD)}
[hidden]{display:none!important}
svg{flex:none}
h1,h2,h3,h4{margin:0;font-family:var(--serif);font-weight:500;letter-spacing:-.01em}
.mut{color:var(--mut);font-size:13.5px}
.small{font-size:12.5px}
.lab{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mut2)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.flex1{flex:1;min-width:0}
.tab{font-variant-numeric:tabular-nums}

/* ---------- tugmalar, belgilar ---------- */
.btn{min-height:44px;padding:0 16px;border-radius:12px;font-weight:500;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line2);white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--ink);color:var(--bg);box-shadow:none}
.btn.clay{background:var(--clay);color:#fff;box-shadow:none}
.btn.clay:hover{background:var(--clayD)}
.btn.okb{background:var(--ok);color:#fff;box-shadow:none}
.btn.ghost{background:transparent;box-shadow:none;color:var(--ink2)}
.btn.ghost:hover{background:var(--soft)}
.btn.red{background:transparent;color:var(--err);box-shadow:inset 0 0 0 1px var(--errSoft)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.ibtn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--mut)}
.ibtn:hover{background:var(--soft);color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;flex:none;background:var(--soft);color:var(--ink2)}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
@keyframes pulse{50%{opacity:.35}}
.p-kutmoqda{background:var(--soft);color:var(--mut)}
.p-navbatda{background:var(--violetSoft);color:var(--violet)}
.p-ishlamoqda{background:var(--infoSoft);color:var(--info)}.p-ishlamoqda i{animation:pulse 1.5s infinite}
.p-tekshiruvda{background:var(--warnSoft);color:var(--warn)}
.p-tasdiqlandi{background:var(--okSoft);color:var(--ok)}
.p-qayta{background:var(--claySoft);color:var(--clayD)}
.p-eskirgan{background:var(--warnSoft);color:var(--warn)}
.p-xato{background:var(--errSoft);color:var(--err)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 10px;border-radius:8px;background:var(--soft);font-size:12.5px;color:var(--ink2)}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--soft)}
.seg button{flex:1;min-height:38px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--mut);white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--sh)}
.seg button b{font-weight:600;margin-left:4px;color:var(--clayD)}
.opt{display:flex;gap:6px;flex-wrap:wrap}
.opt button{min-height:36px;padding:0 13px;border-radius:999px;font-size:13.5px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink2)}
.opt button.on{background:var(--ink);color:var(--bg);box-shadow:none}
.inp{width:100%;min-height:46px;border-radius:12px;border:0;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line2);padding:11px 14px;outline:none}
textarea.inp{resize:vertical;line-height:1.5}
.inp:focus{box-shadow:inset 0 0 0 2px var(--clay)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.fld{display:flex;flex-direction:column;gap:6px}
.fld p{margin:0;white-space:pre-line;font-size:14.5px}
.fld ul{margin:0;padding-left:18px;font-size:14px}
.bar{height:6px;border-radius:3px;background:var(--soft2);overflow:hidden}.bar>i{display:block;height:100%;background:var(--info);border-radius:3px;transition:width .4s}
audio{width:100%;height:40px}
.empty{border:1.5px dashed var(--line2);border-radius:18px;padding:22px;text-align:center;color:var(--mut);font-size:14.5px}
.sw{display:flex;gap:5px;flex-wrap:wrap}.sw span{width:26px;height:26px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line)}

/* ---------- ilova qobig'i ---------- */
#app{position:fixed;inset:0;display:flex}
#rail{width:var(--rail);flex:none;border-right:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 12px 14px;gap:4px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.logo i{width:32px;height:32px;border-radius:10px;background:var(--clay);display:flex;align-items:center;justify-content:center;color:#fff}
.logo b{font:500 22px var(--serif)}
.nav{display:flex;align-items:center;gap:11px;min-height:42px;padding:0 12px;border-radius:11px;color:var(--ink2);font-size:14.5px;width:100%;text-align:left}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--soft2);color:var(--ink);font-weight:500}
.nav .n{margin-left:auto;font-size:12px;font-weight:600;color:var(--clayD)}
.railSec{margin:14px 12px 4px}
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#top{flex:none;min-height:calc(60px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 18px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:var(--bg);z-index:5}
#top h1{font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:780px;margin:0 auto;padding:18px 18px 140px;display:flex;flex-direction:column;gap:14px}
.wrapW{max-width:1180px;margin:0 auto;padding:22px 24px 80px;display:flex;flex-direction:column;gap:18px}

/* ---------- lenta kartalari ---------- */
.card{background:var(--panel);border-radius:20px;box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:12px}
.card .kicker{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.card h3{font-size:19px;line-height:1.3}
.hook{margin:0;font:500 17px/1.35 var(--serif)}
.ex{margin:0;font-size:14px;color:var(--ink2);white-space:pre-line;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.media img,.media video{width:100%;display:block;border-radius:14px;background:#000;max-height:62vh;object-fit:contain}
.media video.tall{max-height:70vh}
.vars{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.vars::-webkit-scrollbar{display:none}
.var{flex:none;width:min(78%,300px);border-radius:14px;box-shadow:inset 0 0 0 1px var(--line2);padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--bg)}
.var.on{box-shadow:inset 0 0 0 2px var(--clay)}
.var .vn{font-size:12px;font-weight:600;color:var(--mut2)}
.var p{margin:0;font:500 14.5px/1.35 var(--serif);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.izohBox{display:flex;flex-direction:column;gap:8px}
.acts{display:flex;gap:8px}
.acts .btn{flex:1}
.prog{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:14px;background:var(--panel);box-shadow:var(--sh)}
.lrow{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--panel);box-shadow:var(--sh);width:100%;text-align:left;min-height:64px}
.lrow .t{flex:1;min-width:0}
.lrow .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{width:38px;height:38px;flex:none}
.stage{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--panel);box-shadow:var(--sh);width:100%;text-align:left}
.stage .ico{width:34px;height:34px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}

/* ---------- loyihalar va kutubxona katakchalari ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tile{background:var(--panel);border-radius:18px;box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;min-height:150px}
.tile:hover{box-shadow:var(--sh2)}
.tile h3{font-size:18px}
.tile .img{aspect-ratio:16/10;border-radius:12px;background:var(--soft) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--mut2)}
.tile.add{border:1.5px dashed var(--line2);box-shadow:none;background:transparent;align-items:center;justify-content:center;color:var(--mut)}

/* ---------- doska (cheksiz canvas) ---------- */
#vp{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.3px,transparent 1.3px);background-size:24px 24px}
#vp.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#edges path{fill:none;stroke-width:2.2}
.e-ok{stroke:var(--ok)}.e-wait{stroke:var(--line2)}.e-act{stroke:var(--info);stroke-dasharray:7 7;animation:flow .9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
.grp{position:absolute;border:1.5px dashed var(--line2);border-radius:22px;background:color-mix(in srgb,var(--soft) 45%,transparent)}
.grp.act{border:1.5px solid var(--info)}
.grp-h{position:absolute;left:0;right:0;top:0;height:42px;display:flex;align-items:center;gap:8px;padding:0 16px;cursor:move;font-weight:500;font-size:14px}
.grp-h small{font-weight:400;color:var(--mut);font-size:12.5px}
.node{position:absolute;background:var(--panel);border-radius:16px;box-shadow:var(--sh),inset 0 0 0 1px var(--line);overflow:hidden;transition:box-shadow .15s,opacity .15s}
.node.sel{box-shadow:0 0 0 2.5px var(--clay),var(--sh2)}
.node.st-kutmoqda{opacity:.6}
.node.st-ishlamoqda{box-shadow:0 0 0 2px var(--info),var(--sh)}
.node.st-tekshiruvda{box-shadow:0 0 0 2px var(--warn),var(--sh)}
.node.st-qayta{box-shadow:0 0 0 2px var(--clay),var(--sh)}
.node.st-eskirgan{box-shadow:0 0 0 1.5px var(--warn),var(--sh);border:1.5px dashed transparent}
.node.st-xato{box-shadow:0 0 0 2px var(--err),var(--sh)}
.node.sel.st-tekshiruvda,.node.sel.st-ishlamoqda{box-shadow:0 0 0 2.5px var(--clay),var(--sh2)}
.node.dragging{box-shadow:var(--sh2);z-index:5}
.nh{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line);cursor:move;min-height:46px}
.nh .nn{font-weight:500;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nh .ico{color:var(--mut2);display:flex}
.nb{padding:12px 13px;display:flex;flex-direction:column;gap:9px}
.nb:empty{display:none}
.nf{padding:8px 13px;border-top:1px solid var(--line);font-size:12px;color:var(--mut2);display:flex;gap:8px;align-items:center}
.nf:empty{display:none}
.ph{font-size:13px;color:var(--mut2)}
.thumb{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;background:var(--soft);display:block}
.thumb.ph2{display:flex;align-items:center;justify-content:center;color:var(--mut2);font:500 20px var(--serif)}
.node video{width:100%;border-radius:10px;background:#000;display:block;max-height:280px}
.tur-izoh{background:#FBF3D8}
html[data-theme=dark] .tur-izoh{background:#3A3524}
.tur-izoh .ex{-webkit-line-clamp:12}
#zoom{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:2px;background:var(--panel);box-shadow:var(--sh);border-radius:14px;padding:4px;z-index:4}
#zoom button{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:18px}
#zoom button:hover{background:var(--soft)}
#zoomPct{min-width:54px;text-align:center;font-size:12.5px;color:var(--mut)}
.dtool{position:absolute;right:16px;top:16px;display:flex;gap:6px;z-index:4}
#bosh{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;z-index:6;pointer-events:none}
#bosh>div{pointer-events:auto;max-width:460px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;background:var(--panel);box-shadow:var(--sh2);border-radius:22px;padding:30px}
#bosh p{margin:0;color:var(--mut)}

/* ---------- inspektor (o'ng panel) / telefonda pastki varaq ---------- */
#insp{width:var(--insp);flex:none;border-left:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;min-height:0}
.ihead{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}
.itabs{display:flex;gap:2px;padding:8px 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.itabs button{height:34px;padding:0 12px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--mut);white-space:nowrap}
.itabs button.on{background:var(--soft2);color:var(--ink)}
.ibody{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sec{padding:16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sec:last-child{border-bottom:0}
.log{display:flex;gap:10px;font-size:13px;line-height:1.45}
.log time{font-size:11.5px;color:var(--mut2);flex:none;padding-top:2px;width:40px}
.log.siz span{color:var(--clayD)}.log.agent span{color:var(--ink2)}.log.tizim span{color:var(--mut)}
.ver{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}
.ver b{font-size:12px;color:var(--mut2);width:28px;flex:none;padding-top:2px}
.izh{padding:9px 12px;border-radius:10px;background:var(--soft);font-size:13.5px}
.izh.rad{box-shadow:inset 3px 0 0 var(--err)}
#veil{position:fixed;inset:0;background:rgba(20,20,19,.38);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#veil.on{opacity:1;pointer-events:auto}

/* ---------- agent kompozeri (telefon) ---------- */
#composer{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 26%);z-index:20;display:flex;flex-direction:column;gap:8px}
#composer .box{display:flex;align-items:flex-end;gap:8px;background:var(--panel);box-shadow:var(--sh2);border-radius:22px;padding:8px 8px 8px 14px;max-width:780px;width:100%;margin:0 auto}
#composer textarea{flex:1;border:0;background:transparent;outline:none;resize:none;min-height:40px;max-height:140px;padding:9px 0;line-height:1.45}
#composer .send{width:40px;height:40px;border-radius:14px;background:var(--clay);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
#composer .opt{max-width:780px;width:100%;margin:0 auto}

/* ---------- modal, toast ---------- */
#modal{position:fixed;inset:0;background:rgba(20,20,19,.4);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
#modal>div{width:min(580px,100%);max-height:88vh;overflow:auto;background:var(--bg);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh2)}
#modal h3{font-size:23px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:500;z-index:80;max-width:90vw;box-shadow:var(--sh2);text-align:center}
#toast.err{background:var(--err);color:#fff}

/* ---------- rejimlar ---------- */
body[data-rejim=agent] #rail,body[data-rejim=agent] .studioOnly{display:none!important}
body[data-rejim=studio] #composer,body[data-rejim=studio] .agentOnly,body.inspOpen #composer{display:none!important}
body[data-rejim=agent] #insp{position:fixed;left:0;right:0;bottom:0;width:auto;height:min(88vh,860px);border-left:0;border-radius:24px 24px 0 0;box-shadow:var(--sh2);transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:50}
body[data-rejim=agent].inspOpen #insp{transform:none}
body[data-rejim=agent] .ihead{padding-top:10px}
body[data-rejim=agent] .ihead::before{content:"";position:absolute;left:50%;top:6px;width:40px;height:5px;border-radius:3px;background:var(--soft2);transform:translateX(-50%)}
body[data-rejim=studio]:not(.inspOpen) #insp{display:none}
@media (max-width:1180px){
  body[data-rejim=studio]{--rail:72px}
  body[data-rejim=studio] #rail .txt,body[data-rejim=studio] #rail .railSec,body[data-rejim=studio] .logo b,body[data-rejim=studio] .nav .n{display:none}
  body[data-rejim=studio] .nav{justify-content:center;padding:0}
  body[data-rejim=studio] #insp{position:fixed;right:0;top:0;bottom:0;z-index:50;box-shadow:var(--sh2)}
}
</style>
</head>
<body data-rejim="agent">
<div id="app">
  <aside id="rail" aria-label="Bo'limlar">
    <div class="logo"><i id="logoI"></i><b>Studiya</b></div>
    <button class="btn clay" type="button" data-yangi style="margin:0 2px 10px"><span id="plusI"></span><span class="txt">Yangi video</span></button>
    <button class="nav" type="button" data-nav="lenta"><span data-i="inbox"></span><span class="txt">Agent lentasi</span><span class="n" id="nLenta"></span></button>
    <button class="nav" type="button" data-nav="loyihalar"><span data-i="grid"></span><span class="txt">Loyihalar</span></button>
