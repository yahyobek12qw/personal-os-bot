<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Personal OS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF9F5;--card:#FFFFFF;--ink:#141413;--ink2:#3D3D3A;--mut:#6B6A64;--mut2:#8A8983;--line:rgba(31,30,29,.12);--line2:rgba(31,30,29,.22);--soft:#F0EEE6;--soft2:#E8E6DC;--clay:#D97757;--clayD:#A8472D;--claySoft:#F7DCD0;--ok:#5E7046;--hero:#141413;--heroInk:#FAF9F5;--sh:0 1px 2px rgba(20,20,19,.04),0 4px 16px rgba(20,20,19,.05);--navbg:rgba(255,255,255,.96);--serif:'Source Serif 4',Georgia,serif;--sans:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:light}
html[data-theme=dark]{--bg:#1F1E1D;--card:#2A2927;--ink:#F3F1EA;--ink2:#DAD7CE;--mut:#A6A39A;--mut2:#8C8981;--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.2);--soft:#33322F;--soft2:#3D3C38;--claySoft:#4A2E24;--clayD:#F0A58A;--hero:#30302E;--sh:0 1px 2px rgba(0,0,0,.25);--navbg:rgba(38,37,35,.96);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--clayD)}
input,textarea,select{font:inherit;color:var(--ink)}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
#app{padding:16px 18px 112px;display:flex;flex-direction:column;gap:16px;min-height:100vh}
.mut{color:var(--mut);font-size:13px}
.lab{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px 0}
.sec h2{font-size:20px;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--ink2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill.warn{background:var(--claySoft);color:var(--clayD)}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;color:var(--mut);flex:none}
.btn{min-height:46px;padding:0 16px;border-radius:14px;background:var(--card);box-shadow:var(--sh);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.dark{background:var(--ink);color:var(--bg);box-shadow:none}
.btn.clay{background:var(--clay);color:#fff;box-shadow:none}
.btn.ghost{background:transparent;box-shadow:none;color:var(--clayD)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--card);box-shadow:var(--sh);color:var(--mut)}
.seg button.on{background:var(--ink);color:var(--bg);box-shadow:none}
.bar{height:6px;border-radius:3px;background:var(--soft2);overflow:hidden}.bar>i{display:block;height:100%;border-radius:3px;background:var(--clay)}
.chk{flex:none;width:22px;height:22px;border-radius:11px;border:1.75px solid #A3A29C;background:var(--card);display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--clay);border-color:var(--clay)}
.empty{border:1.5px dashed var(--line2);border-radius:18px;padding:18px;text-align:center;color:var(--mut);font-size:14px}
.skel{border-radius:18px;background:linear-gradient(90deg,var(--soft) 0,var(--soft2) 50%,var(--soft) 100%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:.5px solid var(--line);width:100%;text-align:left}
.li:first-child{border-top:0}
.tl{display:flex;gap:12px;align-items:stretch}
.tl .t{width:44px;flex:none;font-size:13px;font-weight:500;color:var(--mut);font-variant-numeric:tabular-nums;padding-top:3px;text-align:right}
.tl .m{display:flex;flex-direction:column;align-items:center;flex:none;width:22px}
.tl .m i{flex:1;width:2px;background:var(--soft2);margin-top:4px}
.tl .b{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;padding-bottom:16px;text-align:left}
.tl:last-child .m i{display:none}.tl:last-child .b{padding-bottom:4px}
.done .nm{text-decoration:line-through;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;height:calc(80px + env(safe-area-inset-bottom));padding:10px 8px env(safe-area-inset-bottom);background:var(--navbg);border-top:.5px solid var(--line);display:flex;align-items:flex-start;justify-content:space-around;z-index:5;backdrop-filter:blur(12px)}
nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;width:62px;height:50px;font-size:11px;font-weight:500;color:var(--mut2)}
nav button svg{stroke:currentColor}
nav button.on{color:var(--ink);font-weight:600}
nav button.on::after{content:"";position:absolute;bottom:-4px;width:4px;height:4px;border-radius:2px;background:var(--clay)}
nav .plus{width:56px;height:56px;margin-top:-26px;border-radius:20px;background:var(--clay);color:#fff;box-shadow:0 8px 20px rgba(217,119,87,.45);border:4px solid var(--bg);justify-content:center}
nav .badge{position:absolute;top:0;right:10px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--clay);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center}
#veil{position:fixed;inset:0;background:rgba(20,20,19,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#veil.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:12px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:10;display:flex;flex-direction:column;gap:14px}
#sheet.on{transform:none}
#sheet .grab{align-self:center;width:40px;height:5px;border-radius:3px;background:var(--soft2);flex:none}
.inp{width:100%;min-height:48px;border-radius:14px;border:0;background:var(--card);box-shadow:var(--sh);padding:12px 14px;outline:none}
textarea.inp{resize:none;line-height:1.5}
.inp:focus{box-shadow:0 0 0 2px var(--clay)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border-radius:16px;border:.5px solid var(--line2);background:var(--card);padding:11px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:500}
.tile.on{border:2px solid var(--ink);font-weight:600;padding:10px 5px}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mt{position:relative;aspect-ratio:1;border-radius:14px;background:var(--soft) center/cover no-repeat;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:11px;color:var(--mut)}
.mt .cap{position:absolute;left:0;right:0;bottom:0;padding:10px 5px 4px;font-size:10px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55));text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play{width:30px;height:30px;border-radius:15px;background:rgba(20,20,19,.55);display:flex;align-items:center;justify-content:center;padding-left:2px}
#viewer{position:fixed;inset:0;background:#0B0B0A;z-index:30;display:none;flex-direction:column;color:#fff}
#viewer.on{display:flex}
#viewer .vb{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
#viewer .vb>img,#viewer .vb>video{max-width:100%;max-height:100%;object-fit:contain}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;z-index:40;pointer-events:none;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.prop{display:flex;align-items:center;gap:12px;min-height:44px;border-top:.5px solid var(--line);width:100%;text-align:left}
.prop .k{width:112px;flex:none;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut)}
.prop .v{flex:1;min-width:0;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px}
.prop input{border:0;background:transparent;padding:6px 0;outline:none;font-size:14px;min-width:0;width:100%}
.ttl{width:100%;border:0;background:transparent;outline:none;resize:none;font-family:var(--serif);font-size:25px;line-height:1.25;padding:0;color:inherit}
.matn{width:100%;border:0;background:transparent;outline:none;resize:none;font-size:16px;line-height:1.65;color:var(--ink2);padding:0;min-height:60px}
.recbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--claySoft);color:var(--clayD);font-size:14px}
.recbar i{width:10px;height:10px;border-radius:5px;background:var(--clay);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.3}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px 0}
.cal .d{height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px}
.cal .d.on{background:var(--ink);color:var(--bg);font-weight:600}
.cal .d.today:not(.on){color:var(--clayD);font-weight:600}
.cal .dots{display:flex;gap:2px;height:5px}.cal .dots i{width:5px;height:5px;border-radius:3px}
.mood{display:flex;gap:6px}
.mood button{flex:1;height:40px;border-radius:12px;background:var(--soft);font-size:12px;font-weight:500;color:var(--mut)}
.mood button.on{background:var(--ink);color:var(--bg)}
mark{background:var(--claySoft);color:var(--clayD);border-radius:5px;padding:0 3px}
</style>
</head>
<body>
<main id="app"></main>
<nav aria-label="Asosiy menyu">
  <button data-act="tab" data-tab="bugun" aria-label="Bugun"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Bugun</button>
  <button data-act="tab" data-tab="kalendar" aria-label="Kalendar"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Kalendar</button>
  <button data-act="tez" class="plus" aria-label="Yangi qo‘shish"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-act="tab" data-tab="sohalar" aria-label="Sohalar"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>Sohalar</button>
  <button data-act="tab" data-tab="inbox" aria-label="Inbox"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5 5h14l2 8v6H3v-6z"/></svg>Inbox<span class="badge" id="ibadge" hidden></span></button>
</nav>
<div id="veil" data-act="close"></div>
<section id="sheet" role="dialog" aria-modal="true"></section>
<div id="viewer" role="dialog" aria-modal="true" aria-label="Media"></div>
<div id="toast" role="status"></div>
<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (n) => Math.round(Number(n) || 0).toLocaleString('ru-RU').replace(/ /g, ' ');
  const haptic = (t) => { try { if (t === 'ok') tg.HapticFeedback.notificationOccurred('success'); else tg.HapticFeedback.impactOccurred('light'); } catch (e) {} };
  let toastT; const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2800); };

  // ---------- mavzu ----------
  const mavzu = () => { try { return localStorage.getItem('pos-mavzu') || (tg && tg.colorScheme) || 'light'; } catch (e) { return 'light'; } };
  const mavzuQoy = () => { const m = mavzu(); document.documentElement.dataset.theme = m; try { tg.setHeaderColor(m === 'dark' ? '#1F1E1D' : '#FAF9F5'); tg.setBackgroundColor(m === 'dark' ? '#1F1E1D' : '#FAF9F5'); } catch (e) {} };
  mavzuQoy(); if (tg && tg.onEvent) tg.onEvent('themeChanged', () => { try { if (!localStorage.getItem('pos-mavzu')) mavzuQoy(); } catch (e) {} render(); });

  // ---------- belgilar ----------
  const P = {
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', back: '<path d="M15 5l-7 7 7 7"/>', chev: '<path d="M9 5l7 7-7 7"/>', down: '<path d="M5 9l7 7 7-7"/>',
    search: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>', plus: '<path d="M12 5v14M5 12h14"/>', dots: '<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>', cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    event: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><rect x="7" y="13" width="4" height="4" rx="1"/>',
    pen: '<path d="M4 20h4L19 9l-4-4L4 16z"/>', bulb: '<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/>',
    link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
    receipt: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>', income: '<path d="M12 19V5M5 12l7-7 7 7"/>', repeat: '<path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/>',
    folder: '<path d="M3 6h6l2 2h10v11H3z"/>', cap: '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>', book: '<path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"/>',
    play: '<path d="M8 5.5v13l11-6.5z"/>', work: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2M3 12h18"/>', heart: '<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
    home: '<path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M10 21v-6h4v6"/>', star: '<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>',
    spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>', coins: '<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>',
    list: '<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>', flame: '<path d="M12 21c-4 0-6.5-2.6-6.5-6 0-4 3.5-5.5 4-10 2.5 1.5 4 4 4.3 6.3.7-.8 1-2 1-3 2 1.6 3.7 4 3.7 6.7 0 3.4-2.5 6-6.5 6z"/>',
    mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>', cam: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
    file: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>', trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>', moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>', target: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/>',
    debt: '<path d="M7 7h10M7 12h10M7 17h6"/><rect x="3" y="3" width="18" height="18" rx="3"/>', stack: '<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>', inbox: '<path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5 5h14l2 8v6H3v-6z"/>',
    areas: '<rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>',
    tag: '<path d="M3 12V4h8l9 9-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/>', up: '<path d="M7 17L17 7M9 7h8v8"/>', sun2: '<path d="M12 4v1M12 19v1M4 12h1M19 12h1"/><circle cx="12" cy="12" r="5"/>',
  };
  const ic = (k, s, c, w) => '<svg width="' + (s || 18) + '" height="' + (s || 18) + '" viewBox="0 0 24 24" fill="none" stroke="' + (c || 'currentColor') + '" stroke-width="' + (w || 1.8) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (P[k] || P.list) + '</svg>';
  const PLAYI = (s) => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>';

  // ---------- sohalar ranglari ----------
  const RANG = { ish: ['#3D3D3A', '#ECEAE3', '#D8D5CC', '#3A3936'], oqish: ['#4A6636', '#E4EBDA', '#B9CDA6', '#2E3A26'], loy: ['#A84A26', '#F6E1D7', '#F0A58A', '#43281F'], pul: ['#74552A', '#F0E6D4', '#D8BD8D', '#3B3123'],
    sog: ['#9E3636', '#F5DDDD', '#EBA3A3', '#432626'], oila: ['#365F78', '#DCE7EF', '#9EC3DB', '#22313B'], riv: ['#574683', '#E6E2F2', '#BDB0E6', '#2F2A40'], qiz: ['#7D5F0E', '#F3EACC', '#E1C574', '#3D3420'],

  // ---------- ovoz yozish ----------
  const R = { rec: null };
  async function yozishBoshla(maqsad, btn) {
    if (!navigator.mediaDevices || !window.MediaRecorder) return toast('Bu qurilmada ovoz yozib bo‘lmaydi');
    try {
      const st = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/ogg'].find((m) => MediaRecorder.isTypeSupported(m)) || '';
      const rec = new MediaRecorder(st, mime ? { mimeType: mime } : undefined);
      R.chunks = []; R.st = st; R.mime = rec.mimeType || mime || 'audio/webm'; R.t0 = Date.now(); R.maqsad = maqsad; R.btn = btn;
      rec.ondataavailable = (e) => e.data.size && R.chunks.push(e.data);
      rec.onstop = () => yozishTugadi();
      rec.start(250); R.rec = rec;
      if (btn) btn.style.background = 'var(--claySoft)';
      const bar = $('#recBar'); if (bar) bar.hidden = false;
      R.tim = setInterval(() => { const s = Math.round((Date.now() - R.t0) / 1000); const t = $('#recTxt'); if (t) t.textContent = 'Yozilmoqda… ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); if (s >= 120) yozishTugat(); }, 300);
      haptic();
    } catch (e) { toast('Mikrofonga ruxsat bering'); }
  }
  function yozishTugat(bekor) { if (!R.rec) return; R.bekor = !!bekor; clearInterval(R.tim); try { R.rec.stop(); } catch (e) {} R.st.getTracks().forEach((t) => t.stop()); R.rec = null; if (R.btn) R.btn.style.background = ''; const bar = $('#recBar'); if (bar) bar.hidden = true; }
  async function yozishTugadi() {
    if (R.bekor) return;
    const soniya = Math.round((Date.now() - R.t0) / 1000);
    const blob = new Blob(R.chunks, { type: R.mime.split(';')[0] });
    if (soniya < 1 || !blob.size) return toast('Ovoz juda qisqa');
    const ext = R.mime.includes('mp4') ? 'm4a' : R.mime.includes('ogg') ? 'ogg' : 'webm';
    const fayl = new File([blob], 'ovoz-' + soniya + 's.' + ext, { type: R.mime.split(';')[0] });
    if (R.maqsad === 'matn') {
      toast('Matnga aylantirilmoqda…');
      try { const r = await api('ovoz', { audio: await b64(blob), mime: R.mime, soniya }); const t = $('#tMatn'); if (t && r.matn) { t.value = (t.value ? t.value.trim() + ' ' : '') + r.matn; tahlilQil(); } else toast('Ovozdan matn chiqmadi'); } catch (e) { toast(e.message); }
    } else if (R.maqsad === 'pend') { T.pend.push(fayl); tezKor(); }
    else if (R.maqsad === 'el') biriktir(S.par.element.id, [fayl]);
  }
  const b64 = (blob) => new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.readAsDataURL(blob); });
  async function siq(file) {
    if (!file.type.startsWith('image/') || /gif/.test(file.type)) return file;
    try { const bmp = await createImageBitmap(file); const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height)); const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k); c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); const b = await new Promise((r) => c.toBlob((x) => r(x || file), 'image/jpeg', .85)); return new File([b], (file.name || 'rasm').replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }); } catch (e) { return file; }
  }
  async function biriktir(id, files) {
    let n = 0;
    for (const f0 of files) {
      n++; toast('Yuklanmoqda ' + n + '/' + files.length + '…');
      try { const f = await siq(f0); if (f.size > 3.2 * 1048576) { toast(f.name + ' katta (' + mb(f.size) + '). «Katta fayl» orqali botga yuboring'); continue; } await api('biriktir', { id, fayl: await b64(f), mime: f.type, nomi: f.name }); }
      catch (e) { toast(e.message); }
    }
    haptic('ok'); if (S.tab === 'element' && S.par.element.id === id) yukla('element', true);
  }

  // ---------- saqlash yordamchilari ----------
  async function elSaqla(x, jim) {
    const id = S.par.element.id;
    try { await api('saqla', { id, x }); if (!jim) haptic('ok'); Object.keys(S.data).forEach((k) => { if (!k.startsWith('element:')) delete S.data[k]; }); const k = kalit('element', S.par.element); const d = S.data[k]; if (d && x.meta) d.element.meta = Object.assign({}, d.element.meta, x.meta); }
    catch (e) { toast(e.message); }
  }
  async function bajar(id) {
    // ro'yxatlarda optimistik
    const k = kalit(S.tab, S.par[S.tab]); const d = S.data[k];
    const topil = (arr) => (arr || []).find((x) => x.id === id);
    let x = null; if (d) for (const a of [d.reja, d.kechikkan, d.vazifalar, d.yaqin, d.items, d.bolalar, d.qaydlar]) { x = x || topil(a); }
    if (d && d.element && d.element.id === id) x = d.element;
    const yangi = x && x.holat === 'bajarildi' ? 'ochiq' : 'bajarildi';
    if (x) { x.holat = yangi; render(); }
    haptic(yangi === 'bajarildi' ? 'ok' : '');
    try { await api('holat', { id, holat: yangi }); yangila(); } catch (e) { toast(e.message); yukla(S.tab, true); }
  }

  // ---------- hodisalar ----------
  document.addEventListener('click', async (ev) => {
    const el = ev.target.closest('[data-act]'); if (!el) return;
    const a = el.dataset.act;
    if (a !== 'tanla' && el.tagName !== 'LABEL') ev.preventDefault();
    if (a === 'tab') return och(el.dataset.tab);
    if (a === 'orqa') return orqa();
    if (a === 'qayta') return yukla(S.tab);
    if (a === 'close') return yop();
    if (a === 'mavzu') { const y = mavzu() === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('pos-mavzu', y); } catch (e) {} mavzuQoy(); return render(); }
    if (a === 'qidir') { S.qSoz = ''; S.data['qidiruv:null'] = { items: [] }; return kir('qidiruv', null); }
    if (a === 'el') { yop(); yopViewer(); if (el.dataset.almash && S.tab === 'element') { S.par.element = { id: el.dataset.id }; render(); window.scrollTo(0, 0); return yukla('element'); } return kir('element', { id: el.dataset.id }); }
    if (a === 'vEl') { yopViewer(); return kir('element', { id: el.dataset.id }); }
    if (a === 'soha') { S.sfil = 'hammasi'; return kir('soha', { id: el.dataset.id }); }
    if (a === 'sfil') { S.sfil = el.dataset.v; return render(); }
    if (a === 'bajar') return bajar(el.dataset.id);
    if (a === 'tez') { const pre = el.dataset.pre || ''; const preset = {}; if (el.dataset.soha) preset.soha_id = el.dataset.soha; if (el.dataset.sana) preset.sana = el.dataset.sana; return tezSheet(pre, preset); }
    if (a === 'odat') { const done = el.dataset.done !== '1'; haptic(done ? 'ok' : ''); const d = S.data['bugun:null']; const o = d && d.odatlar.find((x) => x.id === el.dataset.id); if (o) { o.done = done; o.streak += done ? 1 : -1; render(); } try { await api('odat', { id: el.dataset.id, done }); } catch (e) { toast(e.message); } return; }
    if (a === 'kayfiyat') { const v = Number(el.dataset.v); const d = S.data['bugun:null']; d.kundalik = Object.assign({}, d.kundalik, { kayfiyat: v }); render(); haptic(); try { await api('kundalik', { kayfiyat: v }); } catch (e) { toast(e.message); } return; }
    if (a === 'kun') { S.kun = el.dataset.v; return render(); }
    if (a === 'oy') { const [y, m] = S.oy.split('-').map(Number); const d = new Date(Date.UTC(y, m - 1 + Number(el.dataset.v), 1)); S.oy = d.toISOString().slice(0, 7); S.kun = S.oy === bugun().slice(0, 7) ? bugun() : S.oy + '-01'; S.par.kalendar = { oy: S.oy }; render(); return yukla('kalendar'); }
    if (a === 'inSoha') { haptic(); try { await api('saqla', { id: el.dataset.id, x: { soha_id: el.dataset.v, inbox: false } }); toast('Sohaga biriktirildi'); yangila(); } catch (e) { toast(e.message); } return; }
    if (a === 'inSana') { haptic(); try { await api('saqla', { id: el.dataset.id, x: { sana: kunQosh(bugun(), Number(el.dataset.v)), inbox: false } }); toast('Rejaga qo‘shildi'); yangila(); } catch (e) { toast(e.message); } return; }
    if (a === 'inOchir') { if (!el.dataset.ok) { el.dataset.ok = 1; el.innerHTML = 'O‘chirilsinmi?'; return; } try { await api('ochir', { id: el.dataset.id }); yangila(); } catch (e) { toast(e.message); } return; }
    if (a === 'link') return ochHavola(el.dataset.u);
    // tez qo'shish
    if (a === 'tTur') { T.ust.tur = el.dataset.v; haptic(); return tezKor(); }
    if (a === 'tSoha') { T.ust.soha_id = (T.ust.soha_id === el.dataset.v ? null : el.dataset.v); haptic(); return tezKor(); }
    if (a === 'tSana') { T.ust.sana = el.dataset.v || null; if (!T.ust.sana) T.ust.vaqt = null; haptic(); return tezKor(); }
    if (a === 'tMic') { if (R.rec) return yozishTugat(); return yozishBoshla('matn', el); }
    if (a === 'tOvozXabar') { if (R.rec) return yozishTugat(); return yozishBoshla('pend', el); }
    if (a === 'tPendDel') { T.pend.splice(Number(el.dataset.i), 1); return tezKor(); }
    // element
    if (a === 'elMenu') return sheet('<h2 style="font-size:24px">Amallar</h2><button class="btn" data-act="elOchir" style="color:var(--clayD)">' + ic('trash', 17) + 'O‘chirish</button>');
    if (a === 'elOchir') { if (!el.dataset.ok) { el.dataset.ok = 1; el.innerHTML = 'Rostdan o‘chirilsinmi? Yana bosing'; return; } try { await api('ochir', { id: S.par.element.id }); yop(); toast('O‘chirildi'); orqa(); yangila(); } catch (e) { toast(e.message); } return; }
    if (a === 'pTur') { const d = S.data[kalit('element', S.par.element)]; return turPicker(d.element.tur, async (v) => { await elSaqla({ tur: v }); yukla('element', true); }); }
    if (a === 'pSoha') { const d = S.data[kalit('element', S.par.element)]; return sohaPicker(d.element.soha_id, async (v) => { await elSaqla({ soha_id: v || null, inbox: !v && !d.element.sana }); yukla('element', true); }); }
    if (a === 'pOta') { const d = S.data[kalit('element', S.par.element)]; return otaPicker(d.element, async (v) => { await elSaqla({ ota_id: v || null }); yukla('element', true); }); }
    if (a === 'pickSoha' || a === 'pickTur' || a === 'pickOta') { const cb = S.pickCb; yop(); return cb && cb(el.dataset.v); }
    if (a === 'pMeta') { await elSaqla({ meta: { [el.dataset.k]: el.dataset.v } }); return yukla('element', true); }
    if (a === 'pKun') { const d = S.data[kalit('element', S.par.element)]; let k = (d.element.meta.kunlar || [1, 2, 3, 4, 5, 6, 7]).slice(); const v = Number(el.dataset.v); k = k.includes(v) ? k.filter((x) => x !== v) : k.concat(v).sort(); await elSaqla({ meta: { kunlar: k } }); return yukla('element', true); }
    if (a === 'ertaga') { await elSaqla({ sana: kunQosh(bugun(), 1) }); toast('Ertaga ko‘chirildi'); return yukla('element', true); }
    if (a === 'tolandi') { try { await api('tolandi', { id: S.par.element.id }); haptic('ok'); toast('Moliya’ga yozildi'); yangila(); } catch (e) { toast(e.message); } return; }
    if (a === 'jamgar') { const v = $('#jSum').value; try { const r = await api('jamgar', { id: S.par.element.id, summa: v }); haptic('ok'); toast('Yig‘ilgan: ' + fmt(r.yigilgan)); yukla('element', true); } catch (e) { toast(e.message); } return; }
    if (a === 'qOchir') { try { await api('ochir', { id: el.dataset.id }); yukla('element', true); } catch (e) { toast(e.message); } return; }
    if (a === 'bolaQosh') { const d = S.data[kalit('element', S.par.element)]; return tezSheet('', { tur: el.dataset.tur, ota_id: d.element.id, soha_id: d.element.soha_id }); }
    if (a === 'mQosh') { const o = $('#mOpt'); if (o) o.hidden = !o.hidden; return; }
    if (a === 'mOvoz') { if (R.rec) return yozishTugat(); return yozishBoshla('el', el); }
    if (a === 'katta') { try { await api('katta', { id: S.par.element.id }); toast('Botga xabar yuborildi — unga javob qilib faylni yuboring'); setTimeout(() => ochHavola('https://t.me/PersonalOS1bot'), 900); } catch (e) { toast(e.message); } return; }
    if (a === 'mview') return korsat(Number(el.dataset.i));
    if (a === 'vYop') return yopViewer();
    if (a === 'vNav') return korsat(VW.i + Number(el.dataset.v));
    if (a === 'fOchir') { if (!el.dataset.ok) { el.dataset.ok = 1; el.textContent = 'Rostdan? Yana bosing'; return; } try { await api('faylOchir', { id: el.dataset.id }); yopViewer(); yukla('element', true); } catch (e) { toast(e.message); } return; }
    // moliya
    if (a === 'yangiTur') { const t = el.dataset.tur; const nom = { tolov: 'Yangi doimiy to‘lov', qarz: 'Yangi qarz', maqsad: 'Yangi jamg‘arma' }[t]; try { const r = await api('saqla', { x: { tur: t, nom, soha_id: 'pul', meta: t === 'qarz' ? { yonalish: 'Men berdim' } : t === 'maqsad' ? { yigilgan: 0 } : { kun: 1, turi: 'Xarajat' } } }); return kir('element', { id: r.id }); } catch (e) { return toast(e.message); } }
    // sohalar
    if (a === 'sohaYangi' || a === 'sohaTahrir') {
      const s = a === 'sohaTahrir' ? sohaOl(el.dataset.id) : null;
      return sheet('<h2 style="font-size:24px">' + (s ? 'Sohani tahrirlash' : 'Yangi soha') + '</h2><form id="fSoha" data-id="' + (s ? s.id : '') + '" style="display:flex;flex-direction:column;gap:12px"><label class="lab" for="sNom">Nomi</label><input id="sNom" class="inp" value="' + esc(s ? s.nom : '') + '" placeholder="Masalan: Sayohat"><label class="lab" for="sIzoh">Izoh</label><input id="sIzoh" class="inp" value="' + esc(s && s.izoh || '') + '" placeholder="Ixtiyoriy">' +
        '<span class="lab">Rangi</span>' + tanlov('rang', Object.keys(RANG).map((k) => [k, '<span style="display:inline-block;width:14px;height:14px;border-radius:7px;background:' + RANG[k][0] + '"></span>']), s ? s.rang : 'yashil') +
        '<span class="lab">Belgisi</span>' + tanlov('ikon', ['work', 'cap', 'folder', 'coins', 'heart', 'home', 'star', 'spark', 'book', 'target', 'list', 'cal'].map((k) => [k, ic(k, 16)]), s ? s.ikon : 'list') +
        '<button class="btn dark" type="submit" style="min-height:52px">Saqlash</button>' + (s ? '<button type="button" class="btn ghost" data-act="sohaArxiv" data-id="' + s.id + '">Sohani yashirish</button>' : '') + '</form>');
    }
    if (a === 'tanla') { el.parentElement.querySelectorAll('.warn').forEach((b) => b.classList.remove('warn')); el.classList.add('warn'); haptic(); return; }
    if (a === 'sohaArxiv') { try { await api('sohaSaqla', { id: el.dataset.id, x: { arxiv: true } }); yop(); toast('Soha yashirildi'); await sohalarYukla(); return och('sohalar'); } catch (e) { return toast(e.message); } }
  });

  // matn maydonlari: avtomatik saqlash
  document.addEventListener('input', (e) => {
    if (e.target.id === 'tMatn') { delete T.ust.tur; tahlilQil(); }
    if (e.target.classList.contains('ttl') || e.target.classList.contains('matn')) { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; }
  });
  document.addEventListener('change', async (e) => {
    const t = e.target;
    if (S.tab === 'element' && t.tagName !== 'TEXTAREA' && (t.dataset.f || t.dataset.m)) {
      if (t.dataset.m) { const v = t.value.trim(); return elSaqla({ meta: { [t.dataset.m]: /^\d+$/.test(v.replace(/\s/g, '')) ? Number(v.replace(/\s/g, '')) : v } }, true); }
      return elSaqla({ [t.dataset.f]: t.value }, true);
    }
    if (t.id === 'mInp') { const fs = [...t.files]; t.value = ''; if (fs.length) biriktir(S.par.element.id, fs); }
    if (t.id === 'tFayl') { T.pend.push(...t.files); t.value = ''; tezKor(); }
    if (t.id === 'tSanaInp') { T.ust.sana = t.value || null; tezKor(); }
    if (t.id === 'tVaqt') { T.ust.vaqt = t.value || null; if (t.value && !(T.ust.sana || (T.t && T.t.sana))) T.ust.sana = bugun(); tezKor(); }
    if (t.id === 'kMatn') { try { await api('kundalik', { matn: t.value }); toast('Kundalik saqlandi'); } catch (er) { toast(er.message); } }
  });
  document.addEventListener('focusout', (e) => { const t = e.target; if (S.tab === 'element' && (t.id === 'eNom' || t.id === 'eMatn')) { const d = S.data[kalit('element', S.par.element)]; if (d && d.element[t.dataset.f] !== t.value) { d.element[t.dataset.f] = t.value; elSaqla({ [t.dataset.f]: t.value }, true); } } });

  document.addEventListener('submit', async (e) => {
    e.preventDefault(); const f = e.target;
    if (f.id === 'fQ') { S.qSoz = $('#qInp').value.trim(); S.par.qidiruv = { q: S.qSoz }; render(); return yukla('qidiruv'); }
    if (f.id === 'fQadam') { const v = $('#qadamInp').value.trim(); if (!v) return; const d = S.data[kalit('element', S.par.element)]; try { await api('saqla', { x: { tur: 'qadam', nom: v, ota_id: d.element.id, soha_id: d.element.soha_id } }); yukla('element', true); setTimeout(() => { const i = $('#qadamInp'); if (i) i.focus(); }, 300); } catch (er) { toast(er.message); } return; }
    if (f.id === 'fSoha') { try { const nom = $('#sNom').value.trim(); await api('sohaSaqla', { id: f.dataset.id || null, x: { nom, izoh: $('#sIzoh').value.trim(), rang: tanlangan('rang'), ikon: tanlangan('ikon') } }); yop(); toast('Saqlandi'); await sohalarYukla(); render(); if (S.tab === 'soha') yukla('soha', true); } catch (er) { toast(er.message); } return; }
    if (f.id === 'fTez') {
      const matn = $('#tMatn').value.trim(); if (!matn) return toast('Nima yozamiz?');
      if (R.rec) yozishTugat(true);
      const btn = $('#tSave'); btn.disabled = true; btn.textContent = 'Saqlanmoqda…';
      try {
        const x = Object.assign({}, T.ust); if (x.sana === undefined) delete x.sana;
        const r = await api('tez', { matn, x });
        if (T.pend.length) { btn.textContent = 'Media yuklanmoqda…'; await biriktir(r.id, T.pend); }
        haptic('ok'); yop();
        const t = Object.assign({}, r.tahlil, T.ust);
        toast((t.inbox && !T.ust.soha_id && !T.ust.sana ? 'Inbox’ga saqlandi' : 'Saqlandi') + (t.sana ? ' · ' + sanaQ(t.sana) : ''));
        yangila();
      } catch (er) { btn.disabled = false; btn.textContent = 'Saqlash'; toast(er.message); }
    }
  });

  // ---------- ishga tushirish ----------
  const h = (location.hash || '').slice(1);
  const st = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
  const eid = (h.match(/^e=([0-9a-f-]{36})$/) || st.match(/^e_([0-9a-f-]{36})$/) || [])[1];
  if (eid) { S.stek = [{ tab: 'bugun', par: null }]; S.tab = 'element'; S.par.element = { id: eid }; render(); yukla('element'); api('bugun').then((r) => { S.data['bugun:null'] = r; }).catch(() => {}); }
  else och(TABS.includes(h) ? h : 'bugun');
})();
</script>
</body>
