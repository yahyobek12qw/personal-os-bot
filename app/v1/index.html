<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Personal OS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#FAF9F5;--slate:#141413;--clay:#D97757;--oat:#E3DACC;--card:#FFFFFF;
  --g100:#F5F4ED;--g150:#F0EEE6;--g200:#E8E6DC;--g500:#87867F;--g550:#73726C;--g600:#5E5D59;--g700:#3D3D3A;
  --line:rgba(31,30,29,.15);--line2:rgba(31,30,29,.3);--hover:rgba(115,114,108,.1);
  --olive:#788C5D;--clayDeep:#A8472D;--claySoft:#F5E1D9;
  --serif:'Anthropic Serif','Source Serif 4',Georgia,'Times New Roman',serif;
  --sans:'Anthropic Sans',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
html[data-theme="dark"]{
  --ivory:#1F1E1D;--slate:#FAF9F5;--card:#2A2927;
  --g100:#262624;--g150:#30302E;--g200:#3D3D3A;--g500:#87867F;--g550:#9C9A92;--g600:#B0AEA5;--g700:#C2C0B6;
  --line:rgba(250,249,245,.1);--line2:rgba(250,249,245,.22);--hover:rgba(250,249,245,.06);
  --olive:#A3B88A;--clayDeep:#F0A58A;--claySoft:rgba(217,119,87,.18);--navbg:rgba(42,41,39,.92);
}
html{--navbg:rgba(255,255,255,.92);--hero:#141413;color-scheme:light}
html[data-theme="dark"]{--hero:#30302E}
html[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--ivory);color:var(--slate);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#app{max-width:560px;margin:0 auto;padding:20px 18px calc(108px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;min-height:100vh}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:500;letter-spacing:0}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.brand i{width:10px;height:10px;border-radius:5px;background:var(--clay)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:.5px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center}
.head{display:flex;flex-direction:column;gap:4px;padding:6px 2px 2px}
.head .lbl{font-size:14px;color:var(--g550)}
.head h1{font-weight:400;font-size:36px;line-height:1.15}
.head .sub{font-size:15px;color:var(--g600)}
.card{background:var(--card);border:.5px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.oat{background:var(--g150);border-color:transparent}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:.5px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:92px;text-align:left}
.tile .n{font-family:var(--serif);font-size:32px;line-height:1}
.tile .t{font-size:13px;color:var(--g550)}
.chip{font-size:12px;padding:2px 8px;border-radius:8px;background:var(--g150);color:var(--g700);line-height:1.6}
.chip.warn{background:var(--claySoft);color:var(--clayDeep)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.btn{border-radius:12px;min-height:44px;padding:0 14px;font-size:14px;font-weight:500;border:.5px solid var(--line2);background:var(--card);color:var(--slate)}
.btn.primary{background:var(--slate);color:var(--ivory);border-color:var(--slate)}
.btn.clay{background:var(--clay);color:#fff;border-color:var(--clay)}
.btn.on{background:var(--slate);color:var(--ivory);border-color:var(--slate)}
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:8px 2px 0}
.sec h2{font-size:22px}
.mut{color:var(--g550);font-size:13px}
.check{flex:none;width:24px;height:24px;border-radius:12px;border:1.5px solid var(--g500);display:flex;align-items:center;justify-content:center;transition:all .15s}
.task{width:100%;text-align:left;background:var(--card);border:.5px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;align-items:flex-start;gap:12px;min-height:64px}
.task .nm{font-size:16px;line-height:1.4}
.task.done{background:var(--g100)}
.task.done .nm{text-decoration:line-through;color:var(--g550)}
.task.done .check{background:var(--clay);border-color:var(--clay)}
.bar{height:6px;border-radius:3px;background:var(--g200);overflow:hidden}.bar i{display:block;height:6px;border-radius:3px;background:var(--clay)}
.empty{border:.5px dashed var(--line2);border-radius:16px;padding:22px;text-align:center;color:var(--g550)}
.skel{border-radius:16px;background:linear-gradient(90deg,var(--g150) 0%,var(--g100) 50%,var(--g150) 100%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:calc(100% - 36px);max-width:524px;height:64px;border-radius:20px;background:var(--navbg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:.5px solid var(--line);display:flex;align-items:center;justify-content:space-around;padding:0 6px;z-index:5;box-shadow:0 6px 24px rgba(0,0,0,.12)}
nav button{position:relative;min-width:56px;height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--g550)}
nav button svg{stroke:var(--g550)}
nav button.on{color:var(--slate);background:var(--g150)}nav button.on svg{stroke:var(--slate)}
.badge{position:absolute;top:4px;right:8px;min-width:16px;height:16px;border-radius:8px;background:var(--clay);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
#veil{position:fixed;inset:0;background:rgba(20,20,19,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#veil.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:560px;background:var(--ivory);border-radius:20px 20px 0 0;border-top:.5px solid var(--line);padding:22px 18px calc(20px + env(safe-area-inset-bottom));transition:transform .25s ease;z-index:10;display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
#sheet.on{transform:translate(-50%,0)}
#sheet h2{font-size:26px}
#sheet label{font-size:14px;color:var(--g600)}
.inp{width:100%;border:.5px solid var(--line2);border-radius:12px;min-height:48px;padding:12px 14px;font-size:16px;background:var(--card);color:var(--slate);outline:none}
.inp:focus{border-color:var(--clay);box-shadow:0 0 0 3px rgba(217,119,87,.18)}
textarea.inp{min-height:100px;resize:none}
.opt{border-radius:10px;padding:0 12px;min-height:36px;font-size:14px;background:var(--card);border:.5px solid var(--line2);color:var(--slate)}
.opt.on{background:var(--slate);color:var(--ivory);border-color:var(--slate)}
.save{border-radius:12px;min-height:50px;background:var(--slate);color:var(--ivory);font-weight:500;font-size:16px}
.mic{flex:none;width:44px;height:44px;border-radius:12px;border:.5px solid var(--line2);background:var(--card);display:flex;align-items:center;justify-content:center}
.mic.rec{background:var(--clay);border-color:var(--clay);animation:pl 1.2s infinite}
@keyframes pl{50%{box-shadow:0 0 0 8px rgba(217,119,87,.18)}}
html,body{transition:background .2s,color .2s}
.recbar{display:flex;align-items:center;gap:10px;border-radius:12px;background:var(--claySoft);color:var(--clayDeep);padding:10px 12px;font-size:14px}
.recbar i{width:8px;height:8px;border-radius:4px;background:var(--clay);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
.list{background:var(--card);border:.5px solid var(--line);border-radius:16px;padding:2px 16px}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0}
.li + .li{border-top:.5px solid var(--line)}
button.li{width:100%;text-align:left}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px}
.seg::-webkit-scrollbar{display:none}
.seg{gap:5px}.seg .opt{flex:1 0 auto;min-height:36px;padding:0 9px;font-size:13px}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;border-radius:16px;overflow:hidden}
.mt{position:relative;aspect-ratio:1;background:var(--g150) center/cover no-repeat;display:flex;align-items:center;justify-content:center;overflow:hidden}
.mplay{width:40px;height:40px;border-radius:20px;background:rgba(20,20,19,.55);display:flex;align-items:center;justify-content:center;padding-left:3px}
.mcap{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mph{font-size:12px;color:var(--g600);padding:6px;text-align:center;word-break:break-all}
#viewer{position:fixed;inset:0;background:#0b0b0a;z-index:30;display:none;flex-direction:column;color:#fff}
#viewer.on{display:flex}
.vtop{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 6px}
.vbtn{width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.12);color:#fff;font-size:16px}
.vcnt{font-size:14px;opacity:.8}
.vbody{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.vbody>img,.vbody>video{max-width:100%;max-height:100%;object-fit:contain}
.vbody>iframe{width:100%;aspect-ratio:16/9;border:0}
.vnav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:56px;color:#fff;font-size:30px;opacity:.7}
.vnav.l{left:2px}.vnav.r{right:2px}
.vbot{padding:12px 18px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
.vbot>span{font-size:13px;opacity:.7}
.vkatta,.vlink{display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 24px;text-align:center;max-width:420px}
.vkatta img,.vlink img{max-width:100%;max-height:40vh;border-radius:12px;object-fit:contain}
.vkatta div{display:flex;flex-direction:column;gap:8px;align-items:center}.vkatta span,.vlink span{opacity:.75;font-size:14px}
.ilvgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.appbar{display:flex;align-items:center;gap:8px}
.appbar [role=tablist]{flex:1}
.appbar .iconbtn{width:40px;height:40px;flex:none}
nav .navadd{min-width:52px;width:52px;height:52px;border-radius:16px;background:var(--clay);color:#fff;box-shadow:0 4px 14px rgba(217,119,87,.35)}
nav .navadd svg{stroke:#fff}
#navO button.on{background:var(--claySoft)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-150%);background:var(--slate);color:var(--ivory);font-size:14px;padding:10px 16px;border-radius:12px;transition:transform .25s;z-index:20;max-width:90%;text-align:center}
#toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

<nav id="navK" aria-label="Asosiy menyu">
  <button data-act="tab" data-tab="home" aria-label="Bugun"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Bugun</button>
  <button data-act="tab" data-tab="inbox" aria-label="Inbox"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5 5h14l2 8v6H3v-6z"/></svg>Inbox<span class="badge" id="inboxBadge" hidden></span></button>
  <button data-act="add" class="navadd" aria-label="Yangi yozuv qo‘shish"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-act="tab" data-tab="pul" aria-label="Pul"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12.5h2M3 10h18"/></svg>Pul</button>
  <button data-act="tab" data-tab="bolimlar" aria-label="Bo‘limlar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>Bo‘limlar</button>
</nav>

<nav id="navO" aria-label="O‘rganish menyusi" hidden>
  <button data-act="tab" data-tab="kutubxona" aria-label="Kutubxona"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"/></svg>Kutubxona</button>
  <button data-act="tab" data-tab="kurslar" aria-label="Kurslar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg>Kurslar</button>
  <button data-act="tab" data-tab="kloyihalar" aria-label="Loyihalar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h6l2 2h10v11H3z"/></svg>Loyihalar</button>
  <button data-act="tab" data-tab="kmedia" aria-label="Media"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>Media</button>
  <button data-act="tab" data-tab="qidiruv" aria-label="Qidiruv"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>Qidiruv</button>
</nav>
<div id="veil" data-act="close"></div>
<section id="sheet" role="dialog" aria-modal="true" aria-label="Oyna"></section>
<div id="toast" role="status"></div>
<div id="viewer" role="dialog" aria-modal="true" aria-label="Media"></div>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {} }

  // ---------- mavzu (yorug' / qorong'i) ----------
  // Tanlov saqlanmagan bo'lsa, Telegram mavzusiga ergashadi
  const saqlangan = () => { try { return localStorage.getItem('pos-mavzu'); } catch (e) { return null; } };
  const mavzu = () => saqlangan() || ((tg && tg.colorScheme) || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  function mavzuQoy() {
    const m = mavzu();
    document.documentElement.dataset.theme = m;
    const fon = m === 'dark' ? '#1F1E1D' : '#FAF9F5';
    try { tg.setHeaderColor(fon); tg.setBackgroundColor(fon); tg.setBottomBarColor && tg.setBottomBarColor(fon); } catch (e) {}
  }
  mavzuQoy();
  if (tg) tg.onEvent('themeChanged', () => { if (!saqlangan()) { mavzuQoy(); render(); } });
  const haptic = (t) => { try { t === 'ok' ? tg.HapticFeedback.notificationOccurred('success') : tg.HapticFeedback.impactOccurred('light'); } catch (e) {} };

  // ---------- yordamchilar ----------
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (n) => Math.round(n || 0).toLocaleString('ru-RU');
  const bugun = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tashkent', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
  const kunQosh = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const OYLAR = ['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
  const KUNLAR = ['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
  const sanaUz = (iso) => { const d = new Date(iso + 'T00:00:00Z'); return KUNLAR[d.getUTCDay()] + ', ' + d.getUTCDate() + '-' + OYLAR[d.getUTCMonth()]; };
  const sanaQisqa = (iso) => {
    if (!iso) return '';
    const b = bugun();
    if (iso === b) return 'Bugun';
    if (iso === kunQosh(b, 1)) return 'Ertaga';
    if (iso === kunQosh(b, -1)) return 'Kecha';
    const d = new Date(iso + 'T00:00:00Z');
    return d.getUTCDate() + '-' + OYLAR[d.getUTCMonth()].slice(0, 3);
  };
  const qolganKun = () => Math.max(0, Math.round((Date.parse('2027-03-31T00:00:00Z') - Date.parse(bugun() + 'T00:00:00Z')) / 86400000));
  const vaqtOldin = (iso) => {
    const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
    if (m < 60) return m + ' daqiqa oldin';
    if (m < 1440) return Math.round(m / 60) + ' soat oldin';
    return Math.round(m / 1440) + ' kun oldin';
  };
  const salom = () => { const h = Number(new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Tashkent', hour: '2-digit', hour12: false }).format(new Date())); return h < 5 ? 'Xayrli tun' : h < 12 ? 'Xayrli tong' : h < 18 ? 'Xayrli kun' : 'Xayrli kech'; };

  let toastT;
  const toast = (t) => { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 3200); };

  async function api(action, body) {
    const r = await fetch('/api/app', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Init-Data': (tg && tg.initData) || '' },
      body: JSON.stringify(Object.assign({ action }, body || {}))
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Xatolik');
    return d;
  }

  const S = { rejim: (() => { try { return localStorage.getItem('pos-rejim') || 'kiritish'; } catch (e) { return 'kiritish'; } })(), stek: [], par: {}, dkey: {}, kList: [], kfil: 'hammasi', ktab: 'darslar', dtab: 'tavsif', yopiqBolim: {}, qSoz: '', tab: 'home', data: {}, lfilter: 'faol', pseg: 'umumiy', oseg: 'top', rseg: 'hammasi', mLoy: '', mTur: 'hammasi', mList: [] };

  const MIC = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
  const CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const skeleton = () => '<div class="skel" style="height:40px;width:60%"></div><div class="skel" style="height:150px"></div><div class="skel" style="height:64px"></div><div class="skel" style="height:64px"></div>';
  const bosh = (lbl, title, sub) => '<header class="head"><span class="lbl">' + lbl + '</span><h1>' + title + '</h1>' + (sub ? '<span class="sub">' + sub + '</span>' : '') + '</header>';

  // ---------- ekranlar ----------
  const V = {};

  V.home = (d) => {
    const v = d.vazifalar || [], bit = v.filter((x) => x.done).length;
    const proj = (d.maqsad || []).map((l) =>

    if ((d.oxirgi || []).length) h += '<div class="sec"><h2>Oxirgi qo‘shilganlar</h2></div><div class="list">' +
      d.oxirgi.slice(0, 3).map((x) => '<button class="li" data-act="yopen" data-id="' + x.id + '"><span style="display:flex;flex-direction:column;min-width:0"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap' + (x.holat === 'Bajarildi' ? ';text-decoration:line-through;color:var(--g550)' : '') + '">' + esc(x.nom) + '</span>' +
        '<span class="mut">' + (turBelgi[x.turi] || x.turi || '') + (x.muddat ? ' · ' + sanaQisqa(x.muddat) : '') + (x.loyiha ? ' · ' + esc(x.loyiha) : '') + '</span></span>' +
        '<span class="mut" style="flex:none">' + vaqtOldin(x.yaratildi) + '</span></button>').join('') + '</div>';
    return h;
  };
  V.bugun = (d) => V.home(d);

  const vazifaKarta = (v) =>
    '<article class="task' + (v.done ? ' done' : '') + '" style="padding:0;gap:0">' +
      '<button data-act="done" data-id="' + v.id + '" aria-pressed="' + !!v.done + '" aria-label="Bajarildi deb belgilash" style="padding:14px 4px 14px 16px;align-self:stretch;display:flex"><span class="check" style="margin-top:1px">' + (v.done ? CHECK : '') + '</span></button>' +
      '<button data-act="yopen" data-id="' + v.id + '" style="flex:1;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;padding:14px 16px 14px 8px"><span class="nm">' + esc(v.nom) + '</span>' +

  V.bugun = (d) => {

    const eslHtml = !es.length ? '' : '<div class="sec"><h2>Eslatmalar</h2><span class="mut">7 kun ichida</span></div><div class="list">' + es.map((e) => '<button class="li" data-act="esl" data-bolim="' + e.bolim + '"><span style="display:flex;gap:10px;min-width:0;align-items:flex-start"><span style="flex:none">' + e.belgi + '</span><span style="display:flex;flex-direction:column;min-width:0"><span>' + esc(e.matn) + '</span>' + (e.izoh ? '<span class="mut">' + esc(e.izoh) + '</span>' : '') + '</span></span>' +
      '<span class="chip' + (e.kechikkan || e.sana === bugun() ? ' warn' : '') + '" style="flex:none">' + (e.kechikkan ? 'Kechikdi' : sanaQisqa(e.sana)) + '</span></button>').join('') + '</div>';

    const kg = d.kelgusi || [];

    const m = d.muddatsiz || [];

  const turBelgi = { Saralanmagan: 'Inbox', Vazifa: 'Vazifa', "G'oya": 'G‘oya', Qayd: 'Qayd', Havola: 'Havola' };
  V.inbox = (d) => {
    const y = (d.yozuvlar || []).filter((x) => !x.ketdi);
    let h = bosh('Saralash kerak', 'Inbox', y.length ? y.length + ' ta yozuv. Har biriga bitta bosish.' : 'Inbox bo‘sh. Hammasi joyida.');

      const vazifa = x.turi === 'Vazifa';

        '<button data-act="yopen" data-id="' + x.id + '" style="display:flex;flex-direction:column;gap:2px;text-align:left"><span>' + esc(x.nom) + '</span>' +
        '<span class="mut">' + (vazifa ? 'Vazifa · muddat tanlang' : vaqtOldin(x.yaratildi)) + (x.fayl ? ' · media bor' : '') + '</span></button>' +
        (vazifa

          : '<div class="grid3">' +
              '<button class="btn clay" data-act="turi" data-id="' + x.id + '" data-turi="Vazifa">Vazifa</button>' +
              '<button class="btn" data-act="turi" data-id="' + x.id + '" data-turi="G\'oya">G‘oya</button>' +

            '</div>') +
      '</article>';
    }).join('');
    if (!y.length) h += '<div class="empty">Yangi fikrlar botdan yoki bosh sahifadan shu yerga tushadi.</div>';
    return h;
  };

  V.loyihalar = (d) => {
    const hammasi = S.lfilter === 'hammasi';
    const faollar = ['Faol', 'Relizda', 'Ikkinchi darajali'];
    const l = (d.loyihalar || []).filter((x) => hammasi || faollar.includes(x.holat));
    const ft = (k, n) => '<button class="btn' + (S.lfilter === k ? ' on' : '') + '" data-act="lfilter" data-v="' + k + '" aria-pressed="' + (S.lfilter === k) + '" style="min-height:36px">' + n + '</button>';
    let h = orqaga + bosh(l.length + ' ta loyiha', 'Loyihalar') + '<div class="row" style="gap:8px">' + ft('faol', 'Faol') + ft('hammasi', 'Hammasi') + '</div>';
    h += l.map((x) => {
      const ob = x.tg + x.ig;
      const nuqta = faollar.includes(x.holat) ? (x.holat === 'Ikkinchi darajali' ? 'var(--oat)' : 'var(--clay)') : 'var(--g200)';
      return '<article class="card" style="padding:0;gap:0"><button data-act="ledit" data-id="' + x.id + '" style="text-align:left;width:100%;padding:16px;display:flex;flex-direction:column;gap:12px">' +
        '<div class="between"><h2 style="font-size:20px">' + esc(x.nom) + '</h2><span class="chip" style="display:inline-flex;align-items:center;gap:6px"><i style="width:7px;height:7px;border-radius:4px;background:' + nuqta + '"></i>' + esc(x.holat || '') + '</span></div>' +
        (x.maqsadda ? '<div style="display:flex;flex-direction:column;gap:6px"><div class="between" style="font-size:13px"><span class="mut">Obunachilar · TG ' + fmt(x.tg) + ' · IG ' + fmt(x.ig) + '</span><span>' + fmt(ob) + ' / 500</span></div><div class="bar"><i style="width:' + Math.min(100, ob / 5) + '%"></i></div><span class="mut">' + x.mijoz + ' ta real mijoz</span></div>' : '') +
        '<span style="font-size:14px;color:var(--g600)">' + (x.ochiq ? x.ochiq + ' ta ochiq vazifa · ' : '') + 'Keyingi qadam: ' + (x.keyingi ? '<span style="color:var(--slate)">' + esc(x.keyingi) + '</span>' : 'yozilmagan') + '</span>' +
      '</button><button data-act="kgo" data-t="kloyiha" data-id="' + x.id + '" style="border-top:.5px solid var(--line);padding:12px 16px;text-align:left;font-size:14px;color:var(--clayDeep);display:flex;justify-content:space-between">Loyiha sahifasi · media, vazifalar, hujjatlar<span aria-hidden="true">›</span></button></article>';
    }).join('');
    return h;
  };

  // ---------- yangi bo'limlar ----------
  const SUB = ['loyihalar', 'oqish', 'organish', 'oqitish', 'media'];
  const REC = {};
  const yod = (bolim, arr) => { (arr || []).forEach((x) => { REC[x.id] = Object.assign({ _b: bolim }, x); }); return arr || []; };
  const KAT_X = ['Oziq-ovqat', 'Transport', 'Kommunal', 'Internet va servislar', "O'qish", 'Boshqa'];
  const KAT_ALL = ['Maosh', 'Loyiha daromadi'].concat(KAT_X);
  const op = (arr) => arr.map((x) => [x, String(x).replace(/'/g, '‘')]);
  const orqaga = '<button data-act="back" style="align-self:flex-start;display:flex;align-items:center;gap:2px;font-size:14px;color:var(--g600);min-height:32px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Bo‘limlar</button>';

  const yangiTugma = (bolim, matn, klass) => '<button class="btn' + (klass ? ' ' + klass : '') + '" data-act="new" data-bolim="' + bolim + '" style="min-height:48px;width:100%">+ ' + matn + '</button>';
  const foiz = (a, b) => b ? Math.max(0, Math.min(100, a / b * 100)) : 0;
  const ICON = {
    loyihalar: '<path d="M3 6h6l2 2h10v11H3z"/>',
    oqish: '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>',

  const ikonka = (k) => '<span style="flex:none;width:44px;height:44px;border-radius:12px;background:var(--g150);display:flex;align-items:center;justify-content:center;color:var(--clay)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">' + ICON[k] + '</svg></span>';

  V.bolimlar = (d) => {

      '<span class="mut" style="text-align:center;padding:6px 8px">Bu yerda ma’lumot kiritiladi va tahrirlanadi. O‘qish va ko‘rish uchun — tepadagi “Ko‘rish” rejimi.</span>';

  // --- O'qish (TATU) ---
  const topKarta = (x) => {
    const done = x.holat === 'Topshirildi';
    return '<article class="task' + (done ? ' done' : '') + '" style="padding:0;gap:0">' +

      '<button data-act="edit" data-id="' + x.id + '" style="flex:1;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;padding:14px 16px 14px 8px"><span class="nm">' + esc(x.nom) + '</span>' +
      '<span class="chips">' + (x.muddat && !done ? '<span class="chip' + (x.kechikkan ? ' warn' : '') + '">' + (x.kechikkan ? 'Kechikkan · ' : '') + sanaQisqa(x.muddat) + '</span>' : '') +

      (x.ball != null ? '<span class="chip">' + x.ball + ' ball</span>' : '') + (x.holat === 'Jarayonda' ? '<span class="chip">Jarayonda</span>' : '') + '</span></button></article>';
  };
  V.oqish = (d) => {
    yod('fan', d.fanlar); yod('topshiriq', d.topshiriqlar);
    const t = d.topshiriqlar || [], ochiq = t.filter((x) => x.holat !== 'Topshirildi'), bitgan = t.filter((x) => x.holat === 'Topshirildi');
    let h = orqaga + bosh('TATU · sirtqi', 'O‘qish', ochiq.length ? ochiq.length + ' ta topshiriq kutmoqda' : 'Hamma topshiriqlar topshirilgan.') +
      seg('oseg', S.oseg, [['top', 'Topshiriqlar'], ['fan', 'Fanlar (' + (d.fanlar || []).length + ')']]);
    if (S.oseg === 'fan') {
      const f = d.fanlar || [];
      h += f.length ? '<div class="list">' + f.map((x) => '<button class="li" data-act="edit" data-id="' + x.id + '"><span style="display:flex;flex-direction:column;min-width:0"><span>' + esc(x.nom) + '</span><span class="mut">' + [x.holat, x.semestr ? x.semestr + '-semestr' : '', x.oqituvchi].filter(Boolean).map(esc).join(' · ') + '</span></span><span class="chips" style="flex:none">' + (x.ochiq ? '<span class="chip">' + x.ochiq + ' ta ochiq</span>' : '') + (x.baho ? '<span class="chip">' + esc(x.baho) + '</span>' : '') + '</span></button>').join('') + '</div>'
        : '<div class="empty">Fanlarni qo‘shing — topshiriqlarni ularga bog‘laysiz.</div>';
      return h + yangiTugma('fan', 'Fan qo‘shish');
    }
    h += ochiq.map(topKarta).join('');
    if (!ochiq.length) h += '<div class="empty">Mustaqil ish yoki nazorat muddatini qo‘shing — muddat yaqinlashsa kechki xabarda eslataman.</div>';
    h += yangiTugma('topshiriq', 'Topshiriq qo‘shish', 'primary');
    if (bitgan.length) h += '<div class="sec"><h2>Topshirilgan</h2><span class="mut">' + bitgan.length + ' ta</span></div>' + bitgan.slice(0, 8).map(topKarta).join('');
    return h;

  // --- O'rganish ---
  V.organish = (d) => {
    const all = yod('organish', d.royxat);
    const f = S.rseg === 'hammasi' ? all : all.filter((x) => x.holat === S.rseg);
    let h = orqaga + bosh('Kurslar, kitoblar, qiziqishlar', 'O‘rganish', all.length ? all.filter((x) => x.holat === 'Jarayonda').length + ' ta jarayonda' : 'Hali bo‘sh.') +
      seg('rseg', S.rseg, [['hammasi', 'Hammasi'], ['Jarayonda', 'Jarayonda'], ['Rejada', 'Rejada'], ['Tugadi', 'Tugadi']]);
    h += f.map((x) => '<button class="card" data-act="edit" data-id="' + x.id + '" style="text-align:left;width:100%;gap:10px">' +
      '<div class="between" style="align-items:flex-start"><span style="font-size:16px;line-height:1.4">' + esc(x.nom) + '</span><span class="chip" style="flex:none">' + esc((x.turi || '').replace(/'/g, '‘')) + '</span></div>' +
      '<div class="bar"><i style="width:' + (x.progress || 0) + '%' + (x.holat === 'Tugadi' ? ';background:var(--olive)' : '') + '"></i></div>' +
      '<span class="mut">' + esc(x.holat) + ' · ' + (x.progress || 0) + '%' + (x.izoh ? ' · ' + esc(x.izoh.slice(0, 60)) : '') + '</span></button>').join('');
    if (!f.length) h += '<div class="empty">' + (all.length ? 'Bu ro‘yxatda hech narsa yo‘q.' : 'Kurs, kitob, video yoki qiziqishni qo‘shing. “Keyin ko‘raman” narsalar — Rejada.') + '</div>';
    return h + '<div class="grid2">' + yangiTugma('organish', 'Kurs / qiziqish', 'primary') + yangiTugma('odars', 'Kursga dars') + '</div>' +

      try {
        await api('muddat', { id: el.dataset.id, kun: Number(el.dataset.kun) });
        toast('Muddat qo‘yildi: ' + el.textContent); S.data.home = null;
        if (S.tab === 'inbox') { const y = S.data.inbox.yozuvlar.find((x) => x.id === el.dataset.id); if (y) y.ketdi = true; render(); }
        else yukla(S.tab);
      } catch (err) { el.disabled = false; toast(err.message); }
      return;
    }
    if (a === 'turi') {
      const y = S.data.inbox.yozuvlar.find((x) => x.id === el.dataset.id);
      const turi = el.dataset.turi; haptic();
      try {
        await api('turi', { id: y.id, turi });
        if (turi === 'Vazifa') y.turi = 'Vazifa'; else { y.ketdi = true; toast((turBelgi[turi] || turi) + ' sifatida saqlandi'); }
        S.data.home = null; render();
      } catch (err) { toast(err.message); }
      return;
    }
  });

  document.addEventListener('change', (e) => {
    if (e.target.id === 'ilvInp') { const id = joriyIlova(); const fs = [...e.target.files]; e.target.value = ''; if (id && fs.length) biriktir(id, fs); return; }
    if (e.target.id === 'kutInp') { S.kutish.push(...e.target.files); e.target.value = ''; kutishChiz(); return; }
    if (e.target.id !== 'mInp') return;
    const f = e.target.files[0]; if (!f) return;
    const u = URL.createObjectURL(f);
    $('#mPrev').innerHTML = (f.type.startsWith('video/') ? '<video src="' + u + '" muted playsinline style="width:100%;max-height:200px;border-radius:12px;background:#000"></video>' : '<img src="' + u + '" alt="" style="width:100%;max-height:200px;object-fit:cover;border-radius:12px">') +
      '<span class="mut">' + esc(f.name) + ' · ' + mbStr(f.size) + (f.type.startsWith('video/') && f.size > 3.2 * 1048576 ? ' — katta, botga yuboring' : '') + '</span>';
  });
  document.addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target; const btn = f.querySelector('.save'); btn.disabled = true; btn.textContent = 'Saqlanmoqda…';
    try {
      if (f.id === 'fAdd') {
        const matn = $('#aMatn').value.trim(); if (!matn) throw new Error('Avval matn yozing');
        const kun = tanlangan('kun');
        const r = await api('yozuv', { matn, turi: tanlangan('tur'), kun: kun === '' || kun === null ? null : Number(kun) });
        if (S.kutish && S.kutish.length && r.id) {
          btn.textContent = 'Media yuklanmoqda…';
          for (const file of S.kutish) { try { await api('biriktir', Object.assign({ id: r.id }, await faylTayyorla(file))); } catch (er) { toast(er.message); } }
          S.kutish = []; S.data.media = null;
        }
        const qayerda = r.joy === 'Moliya' ? 'Pul bo‘limida' : r.joy === 'Vazifa' ? (r.muddat ? (r.muddat === bugun() ? 'Bugun ro‘yxatida' : 'Bugun → Keyingi kunlar') : 'Inbox’da, muddat kutmoqda') : r.joy === 'Inbox' ? 'Inbox’da' : 'Bosh sahifa → Oxirgi qo‘shilganlar';
        toast('Saqlandi: ' + r.joy + (r.muddat ? ' · ' + sanaQisqa(r.muddat) : '') + ' — ' + qayerda);
      }
      if (f.id === 'fLoy') {
        await api('loyiha', { id: f.dataset.id, tg: $('#lTg').value, ig: $('#lIg').value, keyingi: $('#lKq').value });
        toast('Saqlandi');
      }
      if (f.id === 'fGen') {
        const bolim = f.dataset.bolim;
        await api('saqla', { bolim, id: f.dataset.id || undefined, q: formaQiymat(bolim) });
        toast('Saqlandi');
      }
      if (f.id === 'fQid') {
        S.qSoz = $('#qInp').value.trim(); btn.disabled = false; btn.innerHTML = btn.innerHTML;
        S.data.qidiruv = null; render(); return yukla('qidiruv');
      }
      if (f.id === 'fQayd') {
        const matn = $('#qMatn').value.trim(); if (!matn) throw new Error('Qayd yozing');
        const v = $('#dVid'); const d = S.data.dars;
        await api('qayd', { id: d.dars.id, matn, vaqt: v && v.currentTime > 0 ? Math.floor(v.currentTime) : null });
        haptic('ok'); toast('Qayd saqlandi'); S.data.dars = null; render(); return yukla('dars');
      }
      if (f.id === 'fMedia') {
        const loyiha = tanlangan('mloyiha'), izoh = $('#mIzoh').value.trim();
        if (tanlangan('mrej') === 'havola') {
          await api('mediaQosh', { loyiha, havola: $('#mUrl').value.trim(), izoh });
        } else {
          let file = $('#mInp').files[0]; if (!file) throw new Error('Fayl tanlang');
          const rasm = file.type.startsWith('image/');
          if (rasm) file = await rasmSiq(file);
          if (file.size > 3.2 * 1048576) throw new Error(rasm ? 'Rasm juda katta' : 'Video 3 MB dan katta. Uni botga yuboring va kartochkada loyihani tanlang');
          btn.textContent = 'Yuklanmoqda…';
          await api('mediaQosh', { loyiha, fayl: await b64(file), mime: rasm ? 'image/jpeg' : file.type, nomi: rasm ? 'rasm.jpg' : file.name, izoh });
        }
        toast('Qo‘shildi');
      }
      if (f.id === 'fJam') {
        const sum = Number(String($('#jSum').value).replace(/[^\d.]/g, ''));
        if (!sum) throw new Error('Summani kiriting');
        const r = await api('jamgarma', { id: f.dataset.id, summa: sum * Number(tanlangan('jt') || 1) });
        toast('Yig‘ilgan: ' + fmt(r.yigilgan) + ' so‘m');
      }
      if (f.id === 'fPul') {
        await api('moliya', { turi: f.dataset.turi, summa: $('#pSum').value, kategoriya: tanlangan('kat'), nomi: $('#pNom').value });
        toast(f.dataset.turi + ' yozildi');
      }
      haptic('ok'); yop(); qaytaYukla();
    } catch (err) { toast(err.message); btn.disabled = false; btn.textContent = 'Saqlash'; }
  });

  // ---------- boshlash ----------
  if (!tg || !tg.initData) {
    $('#app').innerHTML = '<div class="empty" style="margin-top:80px">Bu ilova Telegram ichida ishlaydi.<br>@PersonalOS1bot’ni oching va “Ochish” tugmasini bosing.</div>';
    document.querySelector('nav').style.display = 'none';
    return;
  }
  const start = (location.hash || '').slice(1) || (tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
  if (KTAB.includes(start)) ochTab(start);
  else if (['bugun', 'inbox', 'pul', 'bolimlar'].concat(SUB).includes(start)) ochTab(start);
  else ochTab(S.rejim === 'korish' ? 'kutubxona' : 'home');
  if (!KTAB.includes(S.tab) && S.tab !== 'home') yukla('home');
})();
</script>
</body>
</html>
